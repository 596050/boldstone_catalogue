[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "search-analytics-toolkit"
version = "0.1.0"
description = "Local, profile-driven search engine and GA4 API setup and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
keychain = ["keyring>=25,<26"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
searchctl = "searchkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/searchkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
